[project]
name = "django-healthchecks"
version = "1.6.0"
description = "Simple Django app/framework to publish health checks"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael van Tellingen", email = "michaelvantellingen@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2",
    "requests>=2.24.0",
    "certifi>=2020.6.20",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/django-healthchecks"
Documentation = "https://django-healthchecks.readthedocs.io/"
Changelog = "https://github.com/labd/django-healthchecks/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "freezegun>=1.5.5",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "requests-mock>=1.12",
    "ruff>=0.17",
    "tox>=4.26",
    "tox-uv>=1.28",
]
docs = [
    "sphinx>=1.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
filelock = "2026-10-27T00:00:00Z"  # 4.2.4 fixes GHSA-2g95-wg33-c5x2 GHSA-567q-5qvw-pf92 GHSA-9vhv-jxww-xfm5 ...
uv = "2026-10-27T00:00:00Z"  # 0.13.5 fixes GHSA-hq85-5cpj-mr62
virtualenv = "2026-10-27T00:00:00Z"  # 21.14.13 fixes GHSA-394h-qwmc-48pf GHSA-43mp-35q3-x3fq GHSA-494p-63j8-28p3 ...

[tool.hatch.build.targets.wheel]
packages = ["src/django_healthchecks"]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_healthchecks",
    "tests",
    "CHANGELOG.md",
    "CHANGES",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
minversion = "8.0"
strict = true
testpaths = ["tests"]
django_find_project = false
addopts = "--nomigrations --reuse-db"

[tool.coverage.run]
branch = true
source = ["django_healthchecks"]

[tool.coverage.paths]
source = ["src", "*/.tox/*/site-packages"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["django_healthchecks", "tests"]
