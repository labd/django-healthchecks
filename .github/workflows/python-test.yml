name: Python Tests

on: [push]

jobs:

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: pip install tox
    - name: Validate formatting
      run: tox -e format

  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        tox_env:
            - py311-django32
            - py311-django40
            - py311-django42
            - py312-django42
            - py313-django42
            - py311-django52
            - py312-django52
            - py313-django52
            - py314-django52
        include:
            - python-version: "3.11"
              tox_env: py311-django32
            - python-version: "3.11"
              tox_env: py311-django40
            - python-version: "3.11"
              tox_env: py311-django42
            - python-version: "3.12"
              tox_env: py312-django42
            - python-version: "3.13"
              tox_env: py313-django42
            - python-version: "3.11"
              tox_env: py311-django52
            - python-version: "3.12"
              tox_env: py312-django52
            - python-version: "3.13"
              tox_env: py313-django52
            - python-version: "3.14"
              tox_env: py314-django52

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox[toml]
    - name: Test with tox
      run: tox -e ${{ matrix.tox_env }}
